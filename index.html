<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Money Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:system-ui;background:#0d1117;color:#c9d1d9}
.total{margin:12px;padding:14px;border-radius:14px;
background:linear-gradient(135deg,#1f6feb,#2ea043);font-size:18px}
.accounts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.account{background:#161b22;border:1px solid #30363d;border-radius:14px;
padding:12px;display:flex;justify-content:space-between}
.balance{font-size:18px;font-weight:700}
.add-btn{background:#2ea043;color:#fff;border:none;width:34px;height:34px;
border-radius:50%;font-size:20px}
.list{padding:12px}
.item{background:#161b22;border-radius:12px;padding:12px;margin-bottom:10px}
.item.credit{border-left:4px solid #2ea043}
.item.debit{border-left:4px solid #f85149}
.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;
border-radius:50%;background:#1f6feb;color:#fff;border:none;font-size:28px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
justify-content:center;align-items:center}
.box{background:#161b22;padding:18px;border-radius:14px;width:90%}
input,select{width:100%;padding:12px;margin-top:10px;
background:#0d1117;color:#c9d1d9;border:1px solid #30363d;border-radius:10px}
button.save{margin-top:14px;width:100%;padding:14px;border:none;
border-radius:12px;background:#1f6feb;color:#fff}
</style>
</head>

<body>

<div class="total">Total: ₹<span id="total">0</span></div>

<div class="accounts">
  <div class="account" data-a="Milk"><div>Milk<br>₹<span>0</span></div><button class="add-btn">+</button></div>
  <div class="account" data-a="Bus Fare"><div>Bus Fare<br>₹<span>0</span></div><button class="add-btn">+</button></div>
  <div class="account" data-a="M Others"><div>M Others<br>₹<span>0</span></div><button class="add-btn">+</button></div>
  <div class="account" data-a="N Others"><div>N Others<br>₹<span>0</span></div><button class="add-btn">+</button></div>
</div>

<div class="list" id="list"></div>
<button class="fab">+</button>

<div class="modal" id="modal">
  <div class="box">
    <h3 id="titleMode"></h3>
    <input id="desc" placeholder="Spend for">
    <input id="amt" type="number" placeholder="Amount">
    <select id="acc">
      <option>Milk</option><option>Bus Fare</option>
      <option>M Others</option><option>N Others</option>
    </select>
    <button class="save">Save</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuH4G4WRcf7J1G3ie4UBzV2k7Zu8p-QJ5gqGzsFn2pCRYCMF6H-P2Ypa5elAolzPo6/exec";

let mode="DEBIT",active=null,rows=[];
const modal=document.getElementById("modal");

document.querySelectorAll(".add-btn").forEach(b=>{
  b.onclick=()=>{
    mode="CREDIT";
    active=b.parentElement.dataset.a;
    desc.style.display="none";
    acc.style.display="none";
    titleMode.innerText="Add Money";
    modal.style.display="flex";
  };
});

document.querySelector(".fab").onclick=()=>{
  mode="DEBIT";active=null;
  desc.style.display="block";
  acc.style.display="block";
  titleMode.innerText="Spend Money";
  modal.style.display="flex";
};

modal.onclick=e=>e.target===modal&&(modal.style.display="none");

document.querySelector(".save").onclick=()=>{
  const fd=new FormData();
  fd.append("account",active||acc.value);
  fd.append("description",mode==="CREDIT"?"Amount Credited":desc.value);
  fd.append("amount",amt.value);
  fd.append("type",mode);

  fetch(SCRIPT_URL,{method:"POST",body:fd})
    .then(()=>{modal.style.display="none";load();});

  amt.value="";desc.value="";
};

function load(){
  fetch(SCRIPT_URL).then(r=>r.json()).then(d=>{
    rows=d;render();
  });
}

function render(){
  list.innerHTML="";let bal={},total=0;
  rows.forEach(r=>{
    bal[r[2]]=(bal[r[2]]||0)+(r[5]=="CREDIT"?+r[4]:-r[4]);
    total+=r[5]=="CREDIT"?+r[4]:-r[4];
    list.innerHTML+=`
      <div class="item ${r[5].toLowerCase()}">
        ${r[0]} ${r[1]}<br>${r[3]} • ${r[2]}<br>₹${r[4]}
      </div>`;
  });
  document.querySelectorAll(".account").forEach(a=>{
    a.querySelector("span").innerText=bal[a.dataset.a]||0;
  });
  total.innerText=total;
}
load();
</script>

</body>
</html>
