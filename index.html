<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Money Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f2f2f2;
}

/* ACCOUNTS */
.accounts {
  display: flex;
  gap: 8px;
  padding: 10px;
  overflow-x: auto;
}

.account {
  min-width: 120px;
  background: #fff;
  border-radius: 10px;
  padding: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
  text-align: center;
}

.account h4 {
  margin: 0;
  font-size: 13px;
}

.balance {
  font-weight: bold;
  margin: 6px 0;
}

.add-btn {
  background: #4CAF50;
  color: white;
  border: none;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 18px;
}

/* TRANSACTIONS */
.list {
  padding: 10px;
}

.item {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
  font-size: 13px;
}

.item.credit { border-left: 4px solid #4CAF50; }
.item.debit  { border-left: 4px solid #f44336; }

.amount {
  font-weight: bold;
  margin-top: 4px;
}

/* FLOAT BUTTON */
.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff5722;
  color: white;
  border: none;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  font-size: 28px;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: white;
  width: 90%;
  padding: 16px;
  border-radius: 12px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
}

.submit {
  background: #2196F3;
  color: white;
  border: none;
  padding: 12px;
  width: 100%;
  border-radius: 8px;
}
</style>
</head>

<body>

<div class="accounts">
  <div class="account" data-name="Milk"><h4>Milk</h4><div class="balance">₹<span>0</span></div><button class="add-btn">+</button></div>
  <div class="account" data-name="Bus Fare"><h4>Bus Fare</h4><div class="balance">₹<span>0</span></div><button class="add-btn">+</button></div>
  <div class="account" data-name="M Others"><h4>M Others</h4><div class="balance">₹<span>0</span></div><button class="add-btn">+</button></div>
  <div class="account" data-name="N Others"><h4>N Others</h4><div class="balance">₹<span>0</span></div><button class="add-btn">+</button></div>
</div>

<div class="list" id="list"></div>

<button class="fab">+</button>

<div class="modal" id="modal">
  <div class="modal-box">
    <input id="title" placeholder="Spend for">
    <input id="amount" type="number" placeholder="Amount">
    <select id="account">
      <option>Milk</option>
      <option>Bus Fare</option>
      <option>M Others</option>
      <option>N Others</option>
    </select>
    <button class="submit">Save</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyp9pRpCFQVKWXgVQKos63OIlQz2WWH8Cbsv9XI01nFH12LC6RSxEu11UXUV7fkwVRaYg/exec";

const list = document.getElementById("list");
const modal = document.getElementById("modal");

document.querySelector(".fab").onclick = () => modal.style.display = "flex";
modal.onclick = e => e.target === modal && (modal.style.display = "none");

document.querySelector(".submit").onclick = () => {
  fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      account: account.value,
      description: title.value,
      amount: amount.value,
      type: "Debit"
    })
  }).then(() => location.reload());
};

fetch(SCRIPT_URL)
.then(r => r.json())
.then(data => {
  data.forEach(r => {
    const div = document.createElement("div");
    div.className = `item ${r[5].toLowerCase()}`;
    div.innerHTML = `
      <div>${r[0]} ${r[1]}</div>
      <div>${r[2]} – ${r[3]}</div>
      <div class="amount">₹${r[4]} (${r[5]})</div>
    `;
    list.appendChild(div);
  });
});
</script>

</body>
</html>
